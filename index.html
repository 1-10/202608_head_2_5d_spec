<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GNM Head Exporter (Web)</title>
  </head>
  <body>
    <div id="app">
      <header id="toolbar">
        <h1>GNM Head Exporter <span class="subtitle">(Web)</span></h1>
        <div class="toolbar-actions">
          <button id="btn-webcam">Webcam</button>
          <button id="btn-upload">写真を選ぶ</button>
          <input id="file-input" type="file" accept="image/*" hidden />
          <button id="btn-reset">Reset</button>
          <button id="btn-export" disabled>guest zip を書き出す</button>
          <span id="status-message" class="status-message"></span>
        </div>
      </header>

      <div id="content-row">
        <main id="viewport-row">
          <section class="viewport-pane">
            <div class="pane-label">
              3D ビュー（ドラッグで回転 / ホイールで拡大）
              <span class="readouts">
                Yaw <span id="readout-yaw">0.0</span>&deg; / Pitch
                <span id="readout-pitch">0.0</span>&deg;
              </span>
            </div>
            <div class="pane-canvas" id="canvas-head"></div>
          </section>
          <pre id="report"></pre>
        </main>

        <div id="gui-container"></div>
      </div>

      <section id="inspection-panel">
        <h2>検査画像（各段の出力そのもの）</h2>
        <div id="inspection"></div>
      </section>
    </div>

    <video id="webcam-video" autoplay playsinline muted hidden></video>

    <script type="module" src="/src/presentation/main.ts"></script>
  </body>
</html>
