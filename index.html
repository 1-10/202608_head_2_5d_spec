<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GNM Head 疑似3Dアバター</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="app">
      <header id="toolbar">
        <h1>GNM Head 疑似3Dアバター</h1>
        <div class="toolbar-actions">
          <button id="btn-webcam">Webcam</button>
          <button id="btn-upload">Upload Image</button>
          <input id="file-input" type="file" accept="image/*" hidden />
          <button id="btn-reset">Reset</button>
          <button id="btn-export" disabled>Export Guest</button>
          <button id="btn-export-template" disabled>Export Template</button>
          <span id="status-message" class="status-message"></span>
        </div>
      </header>

      <div id="content-row">
        <main id="viewport-row">
          <section class="viewport-pane" id="pane-head">
            <div class="pane-label">GNM HEAD</div>
            <div class="pane-canvas" id="canvas-head"></div>
          </section>
        </main>

        <div id="gui-container"></div>
      </div>

      <footer id="bottom-panel">
        <div class="bottom-row">
          <label>Yaw: <span id="readout-yaw">0.0</span>&deg;</label>
          <label>Pitch: <span id="readout-pitch">0.0</span>&deg;</label>
          <label><input id="toggle-blink" type="checkbox" checked /> Blink</label>
        </div>
      </footer>
    </div>

    <video id="webcam-video" autoplay playsinline muted hidden></video>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
